sources:
  a4i_bigquery:
    kind: bigquery
    project: qwiklabs-gcp-04-ef48e08bc216
    location: US

tools:
  vector_search_recipients:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >
      Semantic vector search over a4i_food.recipient_embeddings using gemini-embedding-2
      and COSINE distance with brute-force search. Returns candidate recipient organizations
      in Atlanta along with their storage, pallet capacity, pickup windows, and profile text.
    parameters:
      - name: posting_text
        type: string
        description: The raw surplus food posting text from the donor or grocer.
      - name: top_k
        type: integer
        description: Number of semantic candidate rows to retrieve (e.g., 20).
    statement: |
      SELECT
        base.recipient_id,
        base.name,
        base.street,
        base.city,
        base.zip_code,
        base.archetype_label,
        base.profile_source,
        base.cold_storage,
        base.frozen_storage,
        base.loading_dock,
        base.refrigerated_transport,
        base.max_pallets,
        base.pickup_window_hours,
        base.service_days,
        base.weekly_households,
        base.populations_served,
        base.latitude,
        base.longitude,
        base.profile_text,
        ROUND(distance, 4) AS distance
      FROM VECTOR_SEARCH(
        TABLE `a4i_food.recipient_embeddings`, 'embedding',
        (SELECT AI.EMBED(@posting_text, endpoint => 'gemini-embedding-2').result AS embedding),
        top_k => @top_k,
        distance_type => 'COSINE',
        options => '{"use_brute_force": true}'
      )
      ORDER BY distance;

  lookup_foodkeeper_shelf_life:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >
      Search USDA FSIS FoodKeeper shelf-life guidance in a4i_food.shelf_life across
      product_name, product_subtitle, and keywords.
    parameters:
      - name: search_term
        type: string
        description: Food item keyword (e.g., spinach, milk, bread, leftovers).
    statement: |
      SELECT
        product_id,
        product_name,
        product_subtitle,
        keywords,
        category,
        refrigerated_hours,
        refrigerated_note,
        pantry_hours,
        pantry_note
      FROM `a4i_food.shelf_life`
      WHERE LOWER(product_name) LIKE CONCAT('%', LOWER(@search_term), '%')
         OR LOWER(IFNULL(product_subtitle, '')) LIKE CONCAT('%', LOWER(@search_term), '%')
         OR LOWER(IFNULL(keywords, '')) LIKE CONCAT('%', LOWER(@search_term), '%')
      LIMIT 10;

  query_recipient_tract_demographics:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >
      Whose neighborhood does this recipient help? Returns the census tract the recipient's
      street address geocodes to (a4i_food.recipient_facts), its poverty, no-vehicle and
      public-assistance rates, its need percentile among Atlanta's tracts (0.5 is the middle),
      and population-weighted Atlanta metro averages. Planted teaching rows have no address,
      so their tract columns are empty. Same query as sql/06_recipient_equity.sql.
    parameters:
      - name: recipient
        type: string
        description: The recipient_id, exact name, or part of the name of an Atlanta recipient organization.
    statement: |
      SELECT
        recipient_id,
        name,
        street,
        city,
        state,
        zip_code,
        archetype_label,
        profile_source,
        cold_storage,
        max_pallets,
        weekly_households,
        tract_source,
        geocode_match,
        tract_geo_id,
        tract_population,
        tract_median_income,
        ROUND(poverty_rate, 4) AS poverty_rate,
        ROUND(no_vehicle_rate, 4) AS no_vehicle_rate,
        ROUND(assistance_rate, 4) AS assistance_rate,
        need_score,
        ROUND(metro_poverty_rate, 4) AS metro_poverty_rate,
        ROUND(metro_no_vehicle_rate, 4) AS metro_no_vehicle_rate,
        ROUND(metro_assistance_rate, 4) AS metro_assistance_rate,
        metro_tracts,
        above_metro_need
      FROM `a4i_food.recipient_facts`
      WHERE CAST(recipient_id AS STRING) = TRIM(@recipient)
         OR LOWER(name) LIKE CONCAT('%', LOWER(TRIM(@recipient)), '%')
      ORDER BY
        CAST(recipient_id AS STRING) = TRIM(@recipient) DESC,
        LOWER(name) = LOWER(TRIM(@recipient)) DESC,
        recipient_id
      LIMIT 5;

toolsets:
  a4i_food_broker_toolset:
    - vector_search_recipients
    - lookup_foodkeeper_shelf_life
    - query_recipient_tract_demographics
